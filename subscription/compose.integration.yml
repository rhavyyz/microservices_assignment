# Da raiz: docker compose -f docker-compose.yml -f subscription/compose.integration.yml up --build
# Overlay evita modificar qualquer arquivo fora de subscription/.
services:
  subscription:
    environment:
      SUBSCRIPTION_DATABASE_URL: ${SUBSCRIPTION_DATABASE_URL:?Defina a URL PostgreSQL de subscription}
      SUBSCRIPTION_SERVICE_TOKEN: ${SUBSCRIPTION_SERVICE_TOKEN:-}
      KAFKA_BROKERS: kafka:9092
      SERVICE_DISCOVERER_URL: http://service-discoverer:8080
      USERS_JWT_ISSUER: ${USERS_JWT_ISSUER:-eventhub-users}
      RESERVATION_SECONDS: ${RESERVATION_SECONDS:-900}
      OFFER_SECONDS: ${OFFER_SECONDS:-600}
    depends_on:
      subscription-db:
        condition: service_healthy
