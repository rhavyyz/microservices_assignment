# Infra privada incluída pelo compose raiz. Nenhuma porta do banco é publicada.
services:
  subscription-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subscription
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: ${SUBSCRIPTION_DB_PASSWORD:?Defina SUBSCRIPTION_DB_PASSWORD}
    volumes:
      - subscription-db-data:/var/lib/postgresql/data
    networks: [subscription-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription -d subscription"]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  subscription-net:
volumes:
  subscription-db-data:
