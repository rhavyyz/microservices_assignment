# Shared architecture of the gateway service (its own backing infra: DB, cache, queue...).
# Shared by all horizontally scaled copies of the app; the app container is defined in the root compose file.
# Included from the root docker-compose.yml via `include:`. Keep names prefixed with "gateway-" to stay unique.
# gateway-db stores the endpoint table (kind, method, path, maxPerMin). No host ports.
services:
  gateway-db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - gateway-db-data:/data/db
    networks: [gateway-net]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  gateway-net:

volumes:
  gateway-db-data:
