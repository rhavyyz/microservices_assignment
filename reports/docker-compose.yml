# Infra of the reports service (included by the root docker-compose.yml). The app itself is defined in the root file.
services:
  reports-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [reports-net]
    environment:
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: ${REPORTS_DB_PASSWORD:-reports} # dev default; set REPORTS_DB_PASSWORD outside the repo
      POSTGRES_DB: reports
    volumes:
      - reports-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports -d reports"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  reports-net:

volumes:
  reports-db-data:
