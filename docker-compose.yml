# Top-level architecture: includes each service's own infra (except the gateway's private DB, a standalone project) and defines one app instance per service.
# All apps join the shared "backbone" network (reach each other by service name) plus their own "<service>-net".
# To scale a service, raise its `deploy.replicas`, or copy its entry under a new name (see the example at the bottom).
include:
  - ./service-discoverer/docker-compose.yml
  - ./certificates/docker-compose.yml
  - ./events/docker-compose.yml
  - ./subscription/docker-compose.yml
  - ./payments/docker-compose.yml
  - ./user/docker-compose.yml
  - ./notifications/docker-compose.yml
  - ./reports/docker-compose.yml

# Shared settings for every app instance. No container_name and no host ports, so replicas can coexist.
x-app: &app
  restart: unless-stopped

networks:
  backbone:
  # Owned by the standalone gateway-db project (gateway/docker-compose.yml); start that one first or `up` fails.
  gateway-net:
    external: true
    name: gateway-net

volumes:
  kafka-data:

services:
  # Shared event bus for all services: single-node Kafka in KRaft mode (no Zookeeper, combined broker+controller).
  # Reachable from any container on "backbone" at kafka:9092. No host ports; data lives in the "kafka-data" volume.
  kafka:
    <<: *app
    image: apache/kafka:3.9.1
    networks: [backbone]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  service-discoverer:
    <<: *app 
    deploy:
      replicas: 1 # We cant horizontally scalle this service at all
    build: ./service-discoverer
    networks: [backbone, service-discoverer-net]
    # environment:
    #   RECHECK_INTERVAL: 5s # optional, this is the default: how often failing hosts are rechecked
    #   RECHECK_MAX_FAILURES: 12 # optional, this is the default: consecutive failed rechecks before a host is dropped
  gateway:
    <<: *app
    deploy:
      replicas: 1 # The fixed host port below prevents scaling this service
    build: ./gateway
    networks: [backbone, gateway-net]
    ports:
      - "8080:8080" # UI-facing entry point
    environment:
      MONGO_URI: mongodb://gateway-db:27017
      # gateway-db is NOT part of this project: start it first with `docker compose -f gateway/docker-compose.yml up -d`
      # SERVICE_DISCOVERER_URL: http://service-discoverer:8080 # optional, this is the default
      # KAFKA_BROKERS: kafka:9092 # optional, this is the default: where the push consumer reads from (no depends_on: the gateway boots without Kafka)
      # NOTIFICATIONS_PUSH_TOPIC: notifications-push # optional, this is the default: topic of the pushes forwarded to /ws
  certificates:
    <<: *app
    deploy:
      replicas: 1
    build:
      context: ./certificates
      additional_contexts:
        discovery: ./service-discoverer/Libs/python
    depends_on:
      certificates-db:
        condition: service_healthy
      certificates-s3:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Config comes from the root .env (see .env.example). Kafka, the discoverer and the bucket are handled in the
    # background: the service still boots and answers /healthcheck if any of them is down.
    environment:
      DATABASE_URL: ${CERTIFICATES_DATABASE_URL:-}
      KAFKA_BROKERS: kafka:9092
      SERVICE_DISCOVERER_URL: http://service-discoverer:8080
      CERTIFICATE_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://certificates-s3:8333
      S3_BUCKET: certificates
      S3_ACCESS_KEY: ${CERTIFICATES_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${CERTIFICATES_S3_SECRET_KEY:-}
      S3_REGION: us-east-1
      # SUBSCRIPTION_EVENTS_TOPIC: subscription.events # optional, this is the default: events consumed (group certificates-service)
      # CERTIFICATES_TOPIC_PARTITIONS: 6 # optional, this is the default: partitions of topics created by the service
    networks: [backbone, certificates-net]
  events:
    <<: *app
    deploy:
      replicas: 1
    # additional_contexts gives the build access to the TypeScript discovery lib, which lives outside ./events
    build:
      context: ./events
      additional_contexts:
        discovery: ./service-discoverer/Libs/typescript
    networks: [backbone, events-net]
    depends_on:
      kafka:
        condition: service_healthy
      events-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://events:${EVENTS_DB_PASSWORD:-events}@events-db:5432/events
      KAFKA_BROKERS: kafka:9092
      # EVENTS_TOPIC: events.events # optional, this is the default: topic the service publishes to (outbox relay); it consumes nothing
      # ACTIVITY_AUTO_END_AFTER_SECONDS: 86400 # optional, this is the default: seconds after an activity's scheduled end when it is ended automatically
  subscription:
    <<: *app
    deploy:
      replicas: 1 # We cant horizontally scalle this service at all
    build: ./subscription
    networks: [backbone, subscription-net]
    depends_on:
      subscription-db:
        condition: service_healthy
    # Config comes from the root .env (see .env.example). The password has a single source (SUBSCRIPTION_DB_PASSWORD);
    # if it has URL-reserved characters, percent-encode it, or set SUBSCRIPTION_DATABASE_URL explicitly with the full URL.
    environment:
      SUBSCRIPTION_DATABASE_URL: ${SUBSCRIPTION_DATABASE_URL:-postgresql://subscription:${SUBSCRIPTION_DB_PASSWORD:-}@subscription-db:5432/subscription}
      KAFKA_BROKERS: kafka:9092
      SERVICE_DISCOVERER_URL: http://service-discoverer:8080
      RESERVATION_SECONDS: ${RESERVATION_SECONDS:-900}
      OFFER_SECONDS: ${OFFER_SECONDS:-600}
  payments:
    <<: *app
    deploy:
      replicas: 1
    # additional_contexts gives the build access to the TypeScript discovery lib, which lives outside ./payments
    build:
      context: ./payments
      additional_contexts:
        discovery: ./service-discoverer/Libs/typescript
    networks: [backbone, payments-net]
  user:
    <<: *app
    deploy:
      replicas: 1
    # additional_contexts gives the build access to the Java discovery lib, which lives outside ./user
    build:
      context: ./user
      additional_contexts:
        discovery: ./service-discoverer/Libs/java
    depends_on:
      user-db:
        condition: service_healthy
    # Config comes from the root .env (see .env.example). The JWT private key is NOT an env var: it is a PEM file
    # generated by user/scripts/gen-dev-keys.sh and mounted read-only, the same for every replica.
    environment:
      USERS_DB_URL: jdbc:postgresql://user-db:5432/users
      USERS_DB_USER: ${USERS_DB_USER:-users}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:-}
      USERS_JWT_ISSUER: ${USERS_JWT_ISSUER:-eventhub-users}
      USERS_JWT_TTL_SECONDS: ${USERS_JWT_TTL_SECONDS:-1800}
      USERS_BCRYPT_STRENGTH: ${USERS_BCRYPT_STRENGTH:-12}
      USERS_DEV_SEED_ENABLED: ${USERS_DEV_SEED_ENABLED:-false}
      USERS_DEV_SEED_NAME: ${USERS_DEV_SEED_NAME:-}
      USERS_DEV_SEED_EMAIL: ${USERS_DEV_SEED_EMAIL:-}
      USERS_DEV_SEED_PASSWORD: ${USERS_DEV_SEED_PASSWORD:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    volumes:
      - ./user/.keys:/run/keys:ro
    networks: [backbone, user-net]
  notifications:
    <<: *app
    deploy:
      replicas: 1
    # additional_contexts gives the build access to the Go discovery lib, which lives outside ./notifications
    build:
      context: ./notifications
      additional_contexts:
        discovery: ./service-discoverer/Libs/go
    networks: [backbone, notifications-net]
    depends_on:
      kafka:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      MONGO_URI: mongodb://notifications-db:27017
      # NOTIFICATIONS_TOPIC: notifications # optional, this is the default
      # NOTIFICATIONS_PARTITIONS: 6 # optional, this is the default
      # NOTIFICATIONS_PUSH_TOPIC: notifications-push # optional, this is the default
      # NOTIFICATIONS_PUSH_PARTITIONS: 6 # optional, this is the default
      # RETENTION_DAYS: 30 # optional, this is the default
  reports:
    <<: *app
    deploy:
      replicas: 1
    # additional_contexts gives the build access to the TypeScript discovery lib, which lives outside ./reports
    build:
      context: ./reports
      additional_contexts:
        discovery: ./service-discoverer/Libs/typescript
    networks: [backbone, reports-net]

  # Identical replicas: just raise `deploy.replicas` on the service.
  # Only when an instance needs different config (env, ID...), copy its entry under a new name, e.g.:
  # payments-2:
  #   <<: *app
  #   deploy:
  #     replicas: 1
  #   build:
  #     context: ./payments
  #     additional_contexts:
  #       discovery: ./service-discoverer/Libs/typescript
  #   networks: [backbone, payments-net]
  #   environment:
  #     INSTANCE_ID: 2
