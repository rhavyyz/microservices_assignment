# Infra of the payments service (included by the root docker-compose.yml). The app itself is defined in the root file.
services:
  payments-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [payments-net]
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:-change-me} # dev default; set PAYMENTS_DB_PASSWORD outside the repo
      POSTGRES_DB: payments
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  payments-net:

volumes:
  payments-db-data:
