# Private architecture of the user service: its own PostgreSQL (Database per Service).
# Shared by all horizontally scaled copies of the app; the app container is defined in the root compose file.
# Included from the root docker-compose.yml via `include:`. Keep names prefixed with "user-" to stay unique.
# No host ports; only reachable as user-db:5432 on the "user-net" network. For local development outside Docker
# publish it on 127.0.0.1 with user/docker-compose.dev.yml.
# The password comes from the root .env (see .env.example); there is deliberately NO default, so without it the
# database refuses to start instead of running with a well-known password.
services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USERS_DB_USER:-users}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks: [user-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d users"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  user-net:

volumes:
  user-db-data:
